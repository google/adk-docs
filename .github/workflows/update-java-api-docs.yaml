# Regenerates docs/api-reference/java/ for a released adk-java version and
# opens the pull request for it. The Java counterpart of
# update-typescript-api-docs.yaml, and deliberately the same shape.
#
# Why this runs in CI rather than on a maintainer's machine:
# tools/java-api-docs/README.md. The short version is that the build compiles
# adk-java from source and resolves its full Maven dependency set, so the
# output depends on the toolchain it was built with. One pinned, disposable
# environment makes it reproducible; a maintainer's laptop does not.
#
# Two triggers, doing different jobs:
#   workflow_dispatch - the real thing. Builds and opens a pull request.
#   pull_request      - a smoke test, only when the generator or this file
#                       changes. Builds and checks the output, opens nothing.

name: Update ADK Java API Reference

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'adk-java version, e.g. 1.13.0. Empty means the latest release.'
        required: false
        type: string

  pull_request:
    paths:
      - 'tools/java-api-docs/**'
      - '.github/workflows/update-java-api-docs.yaml'

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    # A cold Maven build of adk-java plus aggregate Javadoc is the long pole
    # here. This is a ceiling to catch a hang, not a target.
    timeout-minutes: 45

    steps:
      - name: Checkout adk-docs repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The adk-java GitHub release is the authority for Java, not Maven
      # Central -- Central can lag the release and is only a cross-check. That
      # is the opposite of the TypeScript reference, where npm is the source,
      # so the two workflows resolve their versions differently on purpose.
      - name: Resolve the version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
            echo "Using the version given to the workflow: ${version}"
          else
            tag="$(curl -fsSL https://api.github.com/repos/google/adk-java/releases/latest \
                   | jq -r '.tag_name')"
            version="${tag#v}"
            echo "Using the latest google/adk-java release: ${tag}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z, got '${version}'"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check the release tag exists
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags \
               https://github.com/google/adk-java "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::google/adk-java has no tag v${VERSION}"
            exit 1
          fi
          echo "Found v${VERSION}."

      # generate.sh asks for a JDK 17+ and `jar`, both of which this provides.
      # It builds with adk-java's own Maven wrapper, so no Maven here.
      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Record what we are building against
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          {
            echo "### Java API reference"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Target version | \`${VERSION}\` |"
            echo "| java | \`$(java -version 2>&1 | head -1)\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the Java API reference
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: bash tools/java-api-docs/generate.sh "${VERSION}"

      # generate.sh already asserts that index.html renders the version it was
      # asked for, which is the check that matters most and the one the
      # TypeScript script lacked. What it does not check is whether anything
      # else came out of the jar, or whether the analytics tag survived the
      # extract-then-inject dance, so do that here.
      - name: Check the output is real
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TARGET: docs/api-reference/java
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [[ -f "${TARGET}/index.html" ]] || fail "no ${TARGET}/index.html was produced"

          pages="$(find "${TARGET}" -name '*.html' | wc -l)"
          echo "Generated ${pages} HTML pages."
          [[ "${pages}" -ge 100 ]] || fail "only ${pages} HTML pages generated, expected hundreds"

          # The jar carries build metadata that must not be published; the
          # script removes it, and this is here so a change upstream that
          # renames it does not quietly ship it.
          [[ ! -d "${TARGET}/META-INF" ]] || fail "META-INF was extracted into the published docs"

          missing_ga="$(grep -L 'googletagmanager.com/gtag/js' $(find "${TARGET}" -name '*.html') | wc -l)"
          [[ "${missing_ga}" -eq 0 ]] || fail "${missing_ga} HTML files have no analytics tag"

          echo "Output looks right: ${pages} pages, no META-INF, analytics tag present."

      - name: Upload the generated reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-api-reference-${{ steps.resolve.outputs.version }}
          path: docs/api-reference/java
          retention-days: 7

      - name: Check whether anything changed
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/api-reference/java; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The reference already matches this version; nothing to open." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- docs/api-reference/java | tail -1 >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create Pull Request
        if: github.event_name == 'workflow_dispatch' && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.ADK_BOT_GITHUB_TOKEN }}
          commit-message: "docs: update API reference for ADK Java ${{ steps.resolve.outputs.version }}"
          title: "Update API reference docs for ADK Java ${{ steps.resolve.outputs.version }}"
          body: |
            Regenerated `docs/api-reference/java/` with
            `tools/java-api-docs/generate.sh ${{ steps.resolve.outputs.version }}`,
            run by [this workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Upstream release:
            https://github.com/google/adk-java/releases/tag/v${{ steps.resolve.outputs.version }}

            Generated output only. This does not bump the `com.google.adk`
            coordinates quoted in prose or in `examples/java/**/pom.xml`; those
            are a separate change.
          branch: "update-java-api-reference-${{ steps.resolve.outputs.version }}"
          delete-branch: true
          add-paths: docs/api-reference/java
